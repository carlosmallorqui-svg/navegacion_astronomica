<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Navegación Astronómica · VR V07</title><style>
body{margin:0;overflow:hidden;background:#020b17;color:#e8ddc5;font:14px system-ui}#info{position:fixed;top:12px;left:12px;background:#071525bb;padding:10px;border-radius:8px;z-index:2;pointer-events:none}#info small{display:block;color:#b4c9d9}#err{color:#ffb3a0}button{font:inherit}#audioButton{position:fixed;bottom:18px;left:18px;z-index:5;padding:10px 14px;background:#102d47;color:#fff;border:1px solid #7a9fbb;border-radius:8px;display:none}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="info">⚓ Navegación Astronómica · V07 VR<small>Quest 3: entrar en VR · joystick izquierdo caminar · derecho girar</small><small>Gatillo derecho: tomar/soltar timón al acercarse · joystick derecho: gobernar</small><small id="status">Cargando barco...</small><small id="err"></small></div><button id="audioButton" type="button">🔊 Activar sonido del mar</button><script type="module">
import * as THREE from 'three';import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';import {VRButton} from 'three/addons/webxr/VRButton.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020b19);scene.fog=new THREE.FogExp2(0x020b19,.0007);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);document.body.appendChild(VRButton.createButton(renderer));
// Audio del océano: el archivo ya está en GitHub, en la carpeta audio/.
const oceanAudio = new Audio('./audio/Oceano_Mar_Abierto_Prueba_3min.mp3');
oceanAudio.loop = true;
oceanAudio.volume = 0.45;
oceanAudio.preload = 'auto';
const audioButton = document.getElementById('audioButton');
async function startOceanAudio(){
  try { await oceanAudio.play(); audioButton.style.display='none'; }
  catch(e) { console.warn('Audio pendiente de interacción:',e); audioButton.style.display='block'; }
}
audioButton.addEventListener('click',startOceanAudio);
renderer.xr.addEventListener('sessionstart',startOceanAudio);
renderer.xr.addEventListener('sessionend',()=>{oceanAudio.pause();audioButton.style.display='none';});
oceanAudio.addEventListener('error',()=>{audioButton.style.display='block';audioButton.textContent='⚠ No se encuentra el audio del océano';});
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.04,3000);
const rig=new THREE.Group();scene.add(rig);rig.add(camera);camera.position.y=1.65;
const boat=new THREE.Group();scene.add(boat);const hullGroup=new THREE.Group();boat.add(hullGroup);
scene.add(new THREE.HemisphereLight(0x7694d2,0x0b1423,1.45));const moon=new THREE.DirectionalLight(0xa9c6ff,1.25);moon.position.set(-90,150,-70);scene.add(moon);
const loader=new FBXLoader();const texture=new THREE.TextureLoader().load('./modelos/MedievalShipTexture.png');texture.colorSpace=THREE.SRGBColorSpace;
const wood=new THREE.MeshStandardMaterial({map:texture,side:THREE.DoubleSide,roughness:.9});const status=document.getElementById('status'),err=document.getElementById('err');
const parts=['ship','sail_mast','sail_open','sail','sail_pulley','rudder','left_door','rigt_door','anchor','anchor_control','flag','lantern.hanging'];
let hull=null, center=new THREE.Vector3(),size=new THREE.Vector3(15,8,28),failed=[];
for(const name of parts){try{let obj=await loader.loadAsync('./modelos/'+encodeURIComponent(name)+'.fbx');obj.name=name;obj.traverse(n=>{if(n.isMesh){n.material=wood;n.frustumCulled=false}});hullGroup.add(obj);if(name==='ship')hull=obj;}catch(e){failed.push(name);console.warn(e)}}
if(!hull){err.textContent='No se ha cargado ship.fbx';}
const bbox=new THREE.Box3().setFromObject(hull||hullGroup);if(!bbox.isEmpty()){bbox.getCenter(center);bbox.getSize(size);hullGroup.position.sub(center);}
const length=Math.max(size.x,size.z,10),width=Math.min(size.x,size.z);
const longZ=size.z>=size.x; // La dirección larga del casco es la de proa-popa.
const deckY=Math.max(.6,size.y*.08);const sternZ=longZ?size.z*.22:0;const sternX=longZ?0:size.x*.22;
rig.position.set(sternX,deckY,sternZ);rig.rotation.y=0;
const waterY=-size.y*.20;const oceanGeo=new THREE.PlaneGeometry(2500,2500,80,80);oceanGeo.rotateX(-Math.PI/2);const ocean=new THREE.Mesh(oceanGeo,new THREE.MeshPhongMaterial({color:0x0d3455,shininess:105,transparent:true,opacity:.95,side:THREE.DoubleSide}));ocean.position.y=waterY;scene.add(ocean);
const starsGeo=new THREE.BufferGeometry();const starCoords=[];let seed=13429;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<950;i++){const a=rand()*Math.PI*2,v=rand()*.92+.08,r=800;starCoords.push(Math.cos(a)*Math.sqrt(1-v*v)*r,v*r,Math.sin(a)*Math.sqrt(1-v*v)*r)}starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starCoords,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xdbe8ff,size:1.7,sizeAttenuation:false})));
const deckLamp=new THREE.PointLight(0xffbc6b,3,Math.max(12,length*.75));deckLamp.position.set(sternX,deckY+3,sternZ);boat.add(deckLamp);
const railMat=new THREE.MeshStandardMaterial({color:0x725237,roughness:1}); // marcador invisible de suelo, para mantener altura.
const helm=new THREE.Vector3(sternX,deckY,sternZ);let atHelm=false,heading=0,speed=1.2;
const controllers=[renderer.xr.getController(0),renderer.xr.getController(1)];controllers.forEach((c,i)=>{rig.add(c);c.addEventListener('selectstart',()=>{if(i===1 && rig.position.distanceTo(helm)<5){atHelm=!atHelm;status.textContent=atHelm?'Timón activo':'Timón libre';}})});
let gamepads=[null,null];const axes=(i)=>{const sources=renderer.xr.getSession()?.inputSources||[];for(const source of sources){if(source.gamepad && source.handedness===(i===0?'left':'right'))return source.gamepad.axes;}return []};
function stick(a){return {x:a.length>=4?a[2]:a[0]||0,y:a.length>=4?a[3]:a[1]||0}}
const clock=new THREE.Clock();let elapsed=0;
function loop(){const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;
 const left=stick(axes(0)),right=stick(axes(1));
 if(renderer.xr.isPresenting){const move=new THREE.Vector3();camera.getWorldDirection(move);move.y=0;move.normalize();const side=new THREE.Vector3().crossVectors(move,new THREE.Vector3(0,1,0)).normalize();if(Math.hypot(left.x,left.y)>.16){rig.position.addScaledVector(move,-left.y*dt*2.5);rig.position.addScaledVector(side,left.x*dt*2.5)}
 if(atHelm){heading-=right.x*dt*.42;}else if(Math.abs(right.x)>.17){rig.rotation.y-=right.x*dt*1.7;}
 // límites de cubierta aproximados, sin permitir caminar sobre el mar
 const limX=Math.max(1.4,size.x*.39),limZ=Math.max(2.2,size.z*.39);rig.position.x=THREE.MathUtils.clamp(rig.position.x,-limX,limX);rig.position.z=THREE.MathUtils.clamp(rig.position.z,-limZ,limZ);rig.position.y=deckY;
 }
 boat.rotation.y=heading;boat.rotation.z=Math.sin(elapsed*.52)*.007;boat.rotation.x=Math.sin(elapsed*.42)*.005;
 // El océano se desplaza visualmente; barco y jugador permanecen en el mismo marco.
 const p=oceanGeo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,Math.sin(x*.018+elapsed*.7)*.25+Math.cos(z*.022+elapsed*.5)*.2)}p.needsUpdate=true;
 oceanGeo.computeVertexNormals();renderer.render(scene,camera);
}
renderer.setAnimationLoop(loop);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
status.textContent=`Barco cargado · ${failed.length} piezas no disponibles · modo noche`;
if(failed.length)err.textContent='Piezas no cargadas: '+failed.join(', ');
</script></body></html>
